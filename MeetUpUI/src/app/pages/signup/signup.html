<section class="auth-shell">
  <div class="auth-card" #card>
    <h1>Create Your Account</h1>
    <p>Register once and start secure browser calls with your team.</p>

    <form [formGroup]="signupForm" (ngSubmit)="submit()">
      <label>
        Username
        <input type="text" formControlName="username" placeholder="Choose a username" />
      </label>

      <label>
        Email
        <input type="email" formControlName="email" placeholder="you@example.com" />
      </label>

      <label>
        Password
        <input type="password" formControlName="password" placeholder="Minimum 8 characters" />
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="!canSubmit()">{{ isSubmitting() ? 'Creating account...' : 'Sign up' }}</button>
    </form>

    <p class="alt-link">
      Already registered?
      <a routerLink="/login">Log in</a>
    </p>
  </div>
</section>
