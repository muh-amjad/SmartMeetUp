# NO LONGER USED — safe to delete.
#
# This config now lives inline in the LIVEKIT_CONFIG environment variable in
# docker-compose.prod.yml. livekit-server reads a --config file verbatim and performs no ${VAR}
# expansion, so keeping the config in a mounted file meant webhook.api_key stayed as the literal
# string "${LIVEKIT_API_KEY}" and webhooks were never delivered. Docker Compose does interpolate
# environment values, so the config body is defined there instead.
