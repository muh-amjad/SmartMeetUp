<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartMeetUp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Dark-only for now: tells the browser to draw its own controls and scrollbars dark, and
       colours the mobile browser bar to match the app instead of flashing white. -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="SmartMeetUp: video meetings that write their own notes.">
  <!-- SVG for modern browsers (sharp at any size); ICO for the ones that still ask for it. -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body>
  <app-root></app-root>
</body>
</html>
