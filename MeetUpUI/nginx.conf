server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles are content-addressed, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is the file that names the current bundle hashes, so a
    # stale copy would keep pointing browsers at bundles that no longer exist after a redeploy.
    #
    # The security headers are repeated here on purpose. nginx's add_header inheritance is
    # all-or-nothing: a block that sets any add_header stops inheriting the server-level ones, and
    # every SPA route reaches this block through try_files — so without these, the headers would be
    # missing on exactly the responses users actually load.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routing: unknown paths are Angular routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression for the text assets. Caddy also compresses, but this keeps the container correct
    # on its own if it is ever served directly.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Nothing here should be framed or sniffed. The API sets its own equivalents.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
