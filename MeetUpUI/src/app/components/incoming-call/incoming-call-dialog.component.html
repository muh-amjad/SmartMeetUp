@if (invite(); as call) {
  <div class="backdrop">
    <section
      class="call-card"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="incoming-call-title"
      aria-describedby="incoming-call-detail"
      [attr.data-ringing]="ringing()"
      [attr.data-audible]="audible()">
      <div class="caller-avatar" aria-hidden="true">
        <span class="pulse"></span>
        <span class="pulse delay"></span>
        <span class="avatar-letter">{{ initial() }}</span>
      </div>

      <p class="kicker">Incoming call</p>
      <h2 id="incoming-call-title" class="caller-name">{{ call.fromUsername }}</h2>
      <p id="incoming-call-detail" class="detail">
        @if (inAnotherCall()) {
          is inviting you to a call. Answering will end the call you're in now.
        } @else {
          is calling you…
        }
      </p>

      <div class="actions">
        <button type="button" class="call-btn decline" (click)="decline()" [disabled]="answering()">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
          <span>Decline</span>
        </button>
        <button
          #acceptButton
          type="button"
          class="call-btn accept"
          (click)="accept()"
          [disabled]="answering()">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
          <span>{{ answering() ? 'Joining…' : 'Accept' }}</span>
        </button>
      </div>
    </section>
  </div>
}
