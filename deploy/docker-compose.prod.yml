# Production stack for the single-VM demo. Every value that differs between deployments comes from
# deploy/.env, which is never committed — see .env.example for the required keys.
#
# Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build

name: smartmeetup

services:
  caddy:
    image: caddy:2-alpine
    container_name: smartmeetup-caddy
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP-01 challenge; must stay open or certificates cannot renew
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # issued certificates — losing this means re-issuing on every restart
      - caddy-config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: ../MeetUpUI
      dockerfile: Dockerfile
    container_name: smartmeetup-web
    restart: unless-stopped
    expose:
      - "80"

  api:
    build:
      # Context is the solution folder, not the repo root: the Dockerfile is VS-generated and copies
      # "MeetUp.Api/MeetUp.Api.csproj", a path that only resolves from here.
      context: ../MeetUpApi
      dockerfile: MeetUp.Api/Dockerfile
    container_name: smartmeetup-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=smartmeetupdb;Username=postgres;Password=${POSTGRES_PASSWORD}

      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: https://${DOMAIN}
      Jwt__Audience: https://${DOMAIN}
      Jwt__ExpiresMinutes: "180"

      # Single site origin. Caddy serves the app and the API from the same hostname, so this is the
      # only origin that ever needs to be allowed.
      Security__AllowedOrigins__0: https://${DOMAIN}
      Security__EnableHsts: "true"
      Security__RateLimits__Enabled: "true"

      LiveKit__ApiKey: ${LIVEKIT_API_KEY}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET}
      # Browsers reach LiveKit through Caddy over TLS; the API talks to it directly on the network.
      LiveKit__WsUrl: wss://${DOMAIN}/livekit
      LiveKit__HttpUrl: http://livekit:7880

      # ServiceUrl is what this container uses; EgressServiceUrl is what the egress worker uses.
      # Both are in-network here, but they are separate keys because they differ in development.
      BlobStorage__ServiceUrl: http://minio:9000
      BlobStorage__EgressServiceUrl: http://minio:9000
      # Presigned download URLs are signed against this origin, because SigV4 covers the Host header
      # and the path — a URL signed for minio:9000 cannot be opened by a browser, and AssemblyAI
      # could never fetch the recording it is asked to transcribe. Served by Caddy on its own
      # hostname rather than a path prefix, so the signed path reaches MinIO unmodified.
      BlobStorage__PublicServiceUrl: https://storage.${DOMAIN}
      BlobStorage__AccessKey: ${MINIO_ROOT_USER}
      BlobStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      BlobStorage__BucketName: ${S3_BUCKET}
      BlobStorage__ForcePathStyle: "true"
      BlobStorage__RetentionDays: "30"

      AssemblyAi__ApiKey: ${ASSEMBLYAI_API_KEY}

      AiProviders__Default: gemini-2.5-flash
      AiProviders__Providers__gemini-2.5-flash__ApiKey: ${GEMINI_API_KEY}
      AiProviders__Providers__groq-llama-3.3-70b__ApiKey: ${GROQ_API_KEY}
      AiProviders__Providers__openrouter-deepseek-v3__ApiKey: ${OPENROUTER_API_KEY}
      AiProviders__Providers__openai-gpt-4o-mini__ApiKey: ${OPENAI_API_KEY}

      Email__FromEmail: ${EMAIL_FROM}
      Email__FromName: SmartMeetUp
      Email__Resend__ApiKey: ${RESEND_API_KEY}

      Serilog__WriteTo__0__Name: Console
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341

      AdminBootstrap__Emails__0: ${ADMIN_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      livekit:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartmeetup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smartmeetupdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only sibling containers need it. Reaching it from outside goes through SSH.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: smartmeetup-redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    # Must stay roughly in step with livekit-client in MeetUpUI/package.json (2.20.x). v1.8.4 was old
    # enough that the client's /rtc/v1 signal endpoint did not exist on it — the client fell back to
    # /rtc and connected, but only after a failed handshake, and negotiation was unreliable.
    image: livekit/livekit-server:v1.13.2
    container_name: smartmeetup-livekit
    restart: unless-stopped
    environment:
      # Quoted because the value itself contains a colon — "key: secret" is LiveKit's expected
      # format, but unquoted YAML would read it as a nested mapping.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

      # The config is passed as a body rather than a mounted file on purpose. livekit-server reads a
      # --config file verbatim (cmd/server/main.go: getConfigString is a plain os.ReadFile) and does
      # no ${VAR} expansion, so a mounted YAML containing ${LIVEKIT_API_KEY} would leave the literal
      # string in webhook.api_key. LiveKit then fails to find a matching key and silently never signs
      # or sends webhooks — meetings would end without recordings or transcripts ever being
      # registered. Compose *does* interpolate this block, so the value below is always real.
      LIVEKIT_CONFIG: |
        port: 7880

        rtc:
          tcp_port: 7881
          udp_port: 7882
          # The VM has a public address that is not on its own interface, so LiveKit must discover it
          # rather than advertise the private one — otherwise remote peers get an unreachable candidate.
          use_external_ip: true

        redis:
          address: redis:6379

        room:
          auto_create: true
          empty_timeout: 300
          max_participants: 50

        # TURN is deliberately off. LiveKit's TURN needs its own TLS certificate to advertise a
        # turns: URL, and the only certificate on this box belongs to Caddy, which does not touch
        # port 5349. Running it without TLS would advertise a URL that clients refuse to use.
        #
        # Nothing is lost: rtc.tcp_port above is the ICE-over-TCP fallback, which covers the same
        # case — viewers whose network blocks UDP — without needing a certificate.
        #
        # (An earlier version set `turn.tcp_port`, which is not a field LiveKit has; it is `tls_port`.
        # Config parsing is strict, so the server printed the error and exited 0 — which Docker saw
        # as a clean exit and restarted, forever.)
        turn:
          enabled: false

        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://api:8080/api/webhooks/livekit

        logging:
          level: info
    # WebRTC media cannot traverse an HTTPS reverse proxy, so these are published straight on the
    # host. The signalling WebSocket does go through Caddy, on /livekit.
    ports:
      # 7881 is rtc.tcp_port — ICE over TCP. It must be published as TCP; publishing it as UDP left
      # the TCP fallback unreachable while looking correct at a glance.
      - "7881:7881/tcp"
      - "7882:7882/udp"
    expose:
      - "7880"
    depends_on:
      redis:
        condition: service_healthy

  livekit-egress:
    # Pinned rather than :latest — this image bundles Chrome and GStreamer, so an unattended bump is
    # the most likely way for recording to break after an unrelated redeploy. arm64 is published.
    image: livekit/egress:v1.14.1
    container_name: smartmeetup-egress
    restart: unless-stopped
    environment:
      # Same reason as livekit above: a mounted config file is not interpolated, so ${LIVEKIT_API_KEY}
      # would reach egress as a literal and every recording would fail to authenticate. Egress reads
      # the body from EGRESS_CONFIG_BODY, and Compose fills in the values here.
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880

        redis:
          address: redis:6379

        log_level: info
    # Room-composite recording renders through a headless browser, which needs this capability.
    cap_add:
      - CAP_SYS_ADMIN
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: smartmeetup-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  seq:
    # 2025.1 rather than 2024.4: that tag does not exist on Docker Hub, so a deploy would fail on
    # pull. Pinned to a real release (arm64 and amd64 both published) instead of :latest.
    image: datalust/seq:2025.1
    container_name: smartmeetup-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Seq's own login, since Caddy exposes it on a public hostname.
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH}
      # Seq builds absolute links (sign-in redirects, shared queries) from this. Without it they are
      # built from the internal address and send the browser somewhere it cannot reach.
      SEQ_API_CANONICALURI: https://logs.${DOMAIN}
    volumes:
      - seq-data:/data
    expose:
      - "80"
      - "5341"

volumes:
  postgres-data:
  minio-data:
  seq-data:
  caddy-data:
  caddy-config:
