# Local development infrastructure for SmartMeetUp.
#
#   docker compose -f necessary-files/docker-compose.yml up -d
#
# The API and the Angular app run on the host (dotnet run / npm start); everything they depend on
# runs here. Values match appsettings.Development.json.
#
# The explicit project name keeps this stack isolated: its containers, its own network and its
# volumes are all namespaced "smartmeetup-dev_*", so nothing here can collide with another compose
# project on the same machine. Without it, the project name would be the folder name
# ("necessary-files"), which would also orphan the existing volumes.
name: smartmeetup-dev

# Ports are published on 127.0.0.1 rather than every interface, deliberately. On Windows, when a
# port is published on all interfaces, WSL's localhost forwarder (wslrelay) also claims [::1] for
# it, accepts connections there and never answers. "localhost" resolves to ::1 first, so the API's
# database connections hang until Npgsql times out and the app dies on startup.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartmeetup-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartmeetupdb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: meetup-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@meetup.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

  seq:
    # 2024.4 was never published to Docker Hub — pulling it fails with "no such manifest".
    image: datalust/seq:2025.1
    container_name: meetup-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:5341:5341"
      - "127.0.0.1:5340:80"
    volumes:
      - seq-data:/data

  # Catches every outgoing email locally so the follow-up send path can be exercised without a
  # provider account or a verified sending domain. Mailpit rather than the MailHog the plan named:
  # MailHog is unmaintained, and Mailpit is its actively developed drop-in equivalent.
  mailpit:
    image: axllent/mailpit:latest
    container_name: meetup-mailpit
    ports:
      - "127.0.0.1:1025:1025"          # SMTP — what the API sends to
      - "127.0.0.1:8025:8025"          # Web UI — where you read the caught mail
    environment:
      MP_MAX_MESSAGES: 500

  redis:
    image: redis:7-alpine
    container_name: meetup-redis
    # Only LiveKit and Egress use this, over the internal network, so it is deliberately not
    # published. 6379 is the default port of every Redis on the machine: publishing it made this
    # stack fail to start whenever another project's Redis was already running. To inspect it,
    # use: docker exec -it meetup-redis redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    # Pinned rather than :latest, and to the same version production runs. It must stay roughly in
    # step with livekit-client in MeetUpUI/package.json (2.20.x): v1.8.4 was old enough that the
    # client's /rtc/v1 signal endpoint did not exist on it, and negotiation was unreliable.
    image: livekit/livekit-server:v1.13.2
    container_name: meetup-livekit
    # No --node-ip: it would replace every media address with 127.0.0.1, which the recorder's
    # Chrome cannot use. livekit.yaml's enable_loopback_candidate adds 127.0.0.1 for the browsers
    # alongside the container address the recorder needs — see the comment there.
    command: --config /livekit.yaml
    ports:
      - "127.0.0.1:7880:7880"          # WebSocket signalling
      # 7881 is rtc.tcp_port in livekit.yaml — ICE over TCP. Publishing it as UDP (as this file
      # previously did) leaves the TCP fallback unreachable while looking correct at a glance.
      - "127.0.0.1:7881:7881/tcp"      # ICE over TCP fallback
      - "127.0.0.1:7882:7882/udp"      # RTC media
    volumes:
      - ./livekit.yaml:/livekit.yaml
    depends_on:
      redis:
        condition: service_healthy

  minio:
    # From quay.io and pinned: minio/minio on Docker Hub no longer exists, so ":latest" there fails
    # with "pull access denied ... repository does not exist".
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: meetup-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "127.0.0.1:9000:9000"          # S3 API
      - "127.0.0.1:9001:9001"          # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      # "mc ready local" rather than curl: this image has no curl, so the curl check never turns
      # healthy and everything with depends_on: minio waits forever.
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  livekit-egress:
    image: livekit/egress:v1.14.1
    container_name: meetup-livekit-egress
    # Shares LiveKit's network stack, so LiveKit's own container address is local to the recorder
    # and its headless Chrome can always reach the media port (see enable_loopback_candidate in
    # livekit.yaml). Signalling uses 127.0.0.1 for the same reason — see livekit-egress.yaml.
    # Compose service names (redis, minio) still resolve normally.
    network_mode: "service:livekit"
    environment:
      EGRESS_CONFIG_FILE: /out/egress.yaml
    volumes:
      - ./livekit-egress.yaml:/out/egress.yaml
    # Room-composite egress renders the recording via a headless Chrome instance internally,
    # which needs this capability even for audio-only recordings.
    cap_add:
      - CAP_SYS_ADMIN
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  seq-data:
  minio-data:
