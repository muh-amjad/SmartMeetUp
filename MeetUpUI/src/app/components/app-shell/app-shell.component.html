<div class="shell">
  @if (navOpen()) {
    <div class="nav-backdrop" (click)="closeNav()" aria-hidden="true"></div>
  }

  <aside class="sidebar" id="app-sidebar" [class.open]="navOpen()">
    <div class="sidebar-head">
      <a class="brand" routerLink="/dashboard" (click)="closeNav()">
        <span class="brand-mark">M</span>
        <span class="brand-name">MeetUp</span>
      </a>
      <button type="button" class="icon-button nav-close" (click)="closeNav()" aria-label="Close menu">✕</button>
    </div>

    <nav class="nav" aria-label="Main">
      @for (item of nav; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/meetings' }"
          (click)="closeNav()">
          <span class="nav-mark" aria-hidden="true">{{ item.mark }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="icon-button menu-toggle"
        aria-controls="app-sidebar"
        [attr.aria-expanded]="navOpen()"
        aria-label="Open menu"
        (click)="openNav()">
        <span class="hamburger" aria-hidden="true"></span>
      </button>

      <form class="topbar-search" (ngSubmit)="submitSearch()" role="search">
        <input
          type="search"
          placeholder="Search your meetings…"
          aria-label="Search your meetings"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
          name="shellSearch" />
      </form>

      <div class="account">
        <button
          type="button"
          class="avatar"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="menu"
          [attr.aria-label]="'Account menu for ' + username()"
          (click)="toggleMenu()">
          {{ initials() }}
        </button>

        @if (menuOpen()) {
          <div class="menu" role="menu">
            <div class="menu-identity">
              <strong>{{ username() }}</strong>
              <span>{{ email() }}</span>
            </div>
            <a class="menu-item" routerLink="/settings" role="menuitem" (click)="closeMenu()">Settings</a>
            <button type="button" class="menu-item danger" role="menuitem" (click)="logout()">
              Sign out
            </button>
          </div>
        }
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
